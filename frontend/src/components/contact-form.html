<!-- Contact Form Component -->
<section id="contacto" class="section">
    <div class="card-glass p-4">
        <h3 class="section-title">
            <i class="fas fa-envelope me-2"></i>Formulario de Contacto
        </h3>
        <p class="section-subtitle">
            Completa el formulario para registrarte o contactarnos
        </p>

        <form id="contactForm" class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label-modern" for="firstName">Nombre</label>
                    <input type="text" class="form-control-modern" id="firstName" name="firstName" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label-modern" for="lastName">Apellido</label>
                    <input type="text" class="form-control-modern" id="lastName" name="lastName" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label-modern" for="username">Usuario</label>
                    <input type="text" class="form-control-modern" id="username" name="username" minlength="3" maxlength="100" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label-modern" for="email">Email</label>
                    <input type="email" class="form-control-modern" id="email" name="email" required>
                </div>
            </div>
            <div class="col-md-6" id="div_pwd">
                <div class="form-group">
                    <label class="form-label-modern" for="password">Contraseña</label>
                    <input type="password" class="form-control-modern" id="password" name="password" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label-modern" for="phoneNumber">Teléfono</label>
                    <input type="tel" class="form-control-modern" id="phoneNumber" name="phoneNumber">
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <label class="form-label-modern" for="address">Dirección</label>
                    <textarea class="form-control-modern" id="address" name="address" rows="3"></textarea>
                </div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary-modern btn-modern">
                    <i class="fas fa-save me-2"></i>Guardar
                </button>
                <button type="reset" class="btn btn-outline-modern btn-modern ms-2">
                    <i class="fas fa-undo me-2"></i>Limpiar
                </button>
            </div>
        </form>
    </div>
</section>
