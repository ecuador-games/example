<!-- Users Section Component -->
<section id="usuarios" class="section">
    <div class="card-glass p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="section-title mb-0">
                <i class="fas fa-users me-2"></i>Gestión de Usuarios
            </h3>
            <button class="btn btn-primary-modern btn-modern">
                <i class="fas fa-user-plus me-2"></i>Nuevo Usuario
            </button>
        </div>

        <!-- Search Section -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control-modern" id="searchInput" placeholder="Buscar usuario...">
                    <button class="btn btn-primary-modern btn-modern ms-2" onclick="searchUser()">
                        <i class="fas fa-search"></i>
                    </button>
                    <button class="btn btn-outline-modern btn-modern ms-2" onclick="clearSearch()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="table-responsive">
            <div id="usersTable" class="table-modern">
                <!-- Table content will be dynamically generated -->
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-3 text-muted">Cargando usuarios...</p>
                </div>
            </div>
        </div>
    </div>
</section>
